    <script>
        (function checkAuth() {
            try {
                const userRaw = localStorage.getItem('user');
                const currentUser = userRaw ? JSON.parse(userRaw) : null;

                if (!currentUser || typeof currentUser !== 'object') {
                    window.location.href = './login.html';
                    return;
                }

                const role = currentUser.hakAkses || currentUser.hak_akses;
                if (role !== 'Admin') {
                    alert('Akses ditolak! Halaman ini hanya untuk Admin.');
                    window.location.href = 'pengumuman.html';
                }
            } catch (error) {
                console.error('Data session rusak:', error);
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        })();
    </script>

        <!-- SCRIPT UTAMA DASHBOARD -->
        <script>
            const API_URL = 'http://localhost:3000/api/wa'; // Sesuaikan URL backend Anda jika berbeda

            async function checkWaStatus() {
                try {
                    const res = await fetch(`${API_URL}/status`);
                    const result = await res.json();

                    if (!result.success) return;

                    const data = result.data;
                    const badge = document.getElementById('waStatusBadge');
                    const qrContainer = document.getElementById('qrContainer');
                    const qrImage = document.getElementById('qrImage');
                    const logoutContainer = document.getElementById('waLogoutContainer');

                    if (data.isReady) {
                        // 🟢 Terhubung
                        badge.className = 'badge bg-success mb-3 p-2';
                        badge.innerHTML = `✅ Terhubung (${data.phoneNumber || 'Aktif'})`;
                        qrContainer.classList.add('d-none');
                        logoutContainer.classList.remove('d-none');
                    } else if (data.qrCode) {
                        // 🟡 Menunggu Scan QR
                        badge.className = 'badge bg-warning text-dark mb-3 p-2';
                        badge.innerHTML = '📲 Silakan Scan QR Code';
                        qrImage.src = data.qrCode;
                        qrContainer.classList.remove('d-none');
                        logoutContainer.classList.add('d-none');
                    } else {
                        // ⚪ Menyiapkan / Loading
                        badge.className = 'badge bg-secondary mb-3 p-2';
                        badge.innerHTML = '⏳ Menyiapkan WhatsApp...';
                        qrContainer.classList.add('d-none');
                        logoutContainer.classList.add('d-none');
                    }
                } catch (err) {
                    console.error('Gagal mengambil status WA:', err);
                }
            }

            // Handler Logout WA
            document.getElementById('btnLogoutWa')?.addEventListener('click', async () => {
                if (confirm('Apakah Anda yakin ingin mengeluarkan sesi WhatsApp dari server?')) {
                    await fetch(`${API_URL}/logout`, { method: 'POST' });
                    checkWaStatus();
                }
            });

            // Jalankan polling setiap 3 detik
            checkWaStatus();
            setInterval(checkWaStatus, 3000);
        </script>
