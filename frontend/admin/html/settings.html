<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="adminHMD professional admin dashboard template">
  <title>Dashboard & Management Storage | adminHMD</title>

  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
      
  <script>
    (function checkAuth() {
      try {
        const userRaw = localStorage.getItem('user');
        const currentUser = userRaw ? JSON.parse(userRaw) : null;

        if (!currentUser || typeof currentUser !== 'object') {
          window.location.href = './login.html';
          return;
        }

        const role = currentUser.hakAkses || currentUser.hak_akses;
        if (role !== 'Admin') {
          alert('Akses ditolak! Halaman ini hanya untuk Admin.');
          window.location.href = 'pengumuman.html';
        }
      } catch (error) {
        console.error('Data session rusak:', error);
        localStorage.removeItem('user');
        window.location.href = 'login.html';
      }
    })();
  </script>
</head>

<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <a class="brand-mark" href="index.html">
          <span class="brand-icon"><i class="bi bi-grid-1x2-fill"></i></span>
          <span class="brand-copy">
            <span class="brand-title">Admin</span>
            <span class="brand-subtitle">Kecamatan Rumbia</span>
          </span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link active" href="index.html">
          <span class="nav-icon"><i class="bi bi-speedometer2"></i></span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a class="nav-link" href="users.html">
          <span class="nav-icon"><i class="bi bi-people"></i></span>
          <span class="nav-text">Users</span>
        </a>
        <a class="nav-link" href="add-user.html">
          <span class="nav-icon"><i class="bi bi-person-plus"></i></span>
          <span class="nav-text">Tambah User</span>
        </a>
        <a class="nav-link" href="berita-acara-pengumuman.html">
          <span class="nav-icon"><i class="bi bi-newspaper"></i></span>
          <span class="nav-text">Berita & Pengumuman</span>
        </a>
        <a class="nav-link" href="beranda.html">
          <span class="nav-icon"><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i></span>
          <span class="nav-text">Edit Beranda</span>
        </a>
        <a class="nav-link" href="add-page.html">
          <span class="nav-icon"><i class="bi bi-file-earmark-plus"></i></span>
          <span class="nav-text">Halaman Header</span>
        </a>
        <a class="nav-link" href="settings.html">
          <span class="nav-icon"><i class="bi bi-gear"></i></span>
          <span class="nav-text">Settings</span>
        </a>
      </nav>
    </aside>

    <div class="admin-main">
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading mb-4">
            <h1 class="h3">Pengaturan Website (Logo & Footer)</h1>
            <p class="text-muted">Kelola logo instansi dan informasi footer publik.</p>
          </div>

          <form id="settingsForm" enctype="multipart/form-data">
            <div class="row g-4">
              <!-- PENGATURAN LOGO -->
              <div class="col-12 col-lg-5">
                <div class="card p-3 shadow-sm">
                  <h5 class="card-title mb-3"><i class="bi bi-image me-2"></i>Logo Website</h5>
                  <div class="mb-3 text-center">
                    <img id="logoPreview" src="../../img/logo.png" alt="Logo Preview" style="max-height: 120px; object-fit: contain;" class="border p-2 rounded mb-2">
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Unggah Logo Baru</label>
                    <input type="file" id="logoInput" name="logo" class="form-control" accept="image/*">
                    <small class="text-muted">Format PNG/JPG (Rekomendasi latar transparan)</small>
                  </div>
                </div>
              </div>

              <!-- PENGATURAN FOOTER -->
              <div class="col-12 col-lg-7">
                <div class="card p-3 shadow-sm">
                  <h5 class="card-title mb-3"><i class="bi bi-layout-bottom me-2"></i>Pengaturan Footer</h5>
                  
                  <div class="mb-3">
                    <label class="form-label fw-bold">Tentang Singkat / Deskripsi Footer</label>
                    <textarea class="form-control" id="footerAbout" name="footer_about" rows="3" placeholder="Deskripsi singkat kecamatan di footer..."></textarea>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-bold">Alamat Instansi</label>
                    <input type="text" class="form-control" id="footerAddress" name="footer_address" placeholder="Jl. Raya Rumbia No. 1...">
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-bold">Nomor Telepon</label>
                      <input type="text" class="form-control" id="footerPhone" name="footer_phone" placeholder="+62 ...">
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-bold">Email Instansi</label>
                      <input type="email" class="form-control" id="footerEmail" name="footer_email" placeholder="info@rumbia.go.id">
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-bold">Teks Copyright</label>
                    <input type="text" class="form-control" id="footerCopyright" name="footer_copyright" placeholder="Kecamatan Rumbia">
                  </div>

                  <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                    <i class="bi bi-save me-1"></i> Simpan Pengaturan
                  </button>
                </div>
              </div>
            </div>
          </form>

        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>

  <!-- SCRIPT UTAMA DASHBOARD -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Load data pengaturan saat ini
        fetch('http://localhost:3000/api/pengaturan')
            .then(res => res.json())
            .then(data => {
                if(data && !data.error) {
                    if(data.logo) {
                        document.getElementById('logoPreview').src = `http://localhost:3000/uploads/${data.logo}`;
                    }
                    if(data.footer_about) document.getElementById('footerAbout').value = data.footer_about;
                    if(data.footer_address) document.getElementById('footerAddress').value = data.footer_address;
                    if(data.footer_phone) document.getElementById('footerPhone').value = data.footer_phone;
                    if(data.footer_email) document.getElementById('footerEmail').value = data.footer_email;
                    if(data.footer_copyright) document.getElementById('footerCopyright').value = data.footer_copyright;
                }
            })
            .catch(err => console.error("Error loading settings:", err));

        // Form Submit
        document.getElementById('settingsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            fetch('http://localhost:3000/api/pengaturan/update', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(resData => {
                if(resData.success) {
                    alert('Pengaturan Logo & Footer berhasil disimpan!');
                    location.reload();
                } else {
                    alert('Gagal menyimpan: ' + (resData.message || 'Error server'));
                }
            })
            .catch(err => {
                console.error(err);
                alert('Terjadi kesalahan koneksi ke server.');
            });
        });
    });
  </script>
</body>
</html>
