  <script>
    document.addEventListener('DOMContentLoaded', fetchUsers);

    async function fetchUsers() {
      const TARGET_API_URL = '/api/users';
      const tableBody = document.getElementById('userTableBody');

      try {
        const response = await fetch(TARGET_API_URL);
        
        if (!response.ok) {
          throw new Error(`Server respon HTTP error ${response.status}`);
        }

        const result = await response.json();
        
        // Memastikan data fleksibel (baik berupa array langsung [...] maupun { data: [...] })
        const usersList = Array.isArray(result) ? result : (result.data || []);

        if (usersList.length > 0) {
          tableBody.innerHTML = '';

          usersList.forEach(user => {
            const namaUser = user.Nama || user.nama || '-';
            const hakAkses = user.hakAkses || user.hak_akses || 'User';
            const instansi = user.nama_instansi || `Instansi ID: ${user.instansi_id}`;

            const row = `
              <tr>
                <td><strong>#${user.id}</strong></td>
                <td>
                  <div class="d-flex align-items-center">
                    <i class="bi bi-person-circle fs-4 text-secondary me-2"></i>
                    <span>${namaUser}</span>
                  </div>
                </td>
                <td>${user.email}</td>
                <td>${user.phone}</td>
                <td>
                  <span class="badge ${hakAkses === 'Admin' ? 'bg-danger-subtle text-danger' : 'bg-primary-subtle text-primary'} px-2 py-1">
                    ${hakAkses}
                  </span>
                </td>
                <td><span class="text-muted fw-bold">${instansi}</span></td>
                <td><small class="text-wrap d-inline-block text-truncate" style="max-width: 150px;">${user.notes || '-'}</small></td>
                <td>
                 
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${user.id})" title="Hapus User">
                    <i class="bi bi-trash"></i>
                  </button>  
                </td>
              </tr>
            `;
            tableBody.insertAdjacentHTML('beforeend', row);
          });
        } else {
          tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">Belum ada data user terdaftar.</td></tr>`;
        }

      } catch (error) {
        console.error('Error saat mengambil data:', error);
        tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4">Gagal terhubung ke backend server (${error.message}).</td></tr>`;
      }
    }
    async function deleteUser(userId) {
  // Konfirmasi sebelum menghapus
  if (!confirm(`Apakah Anda yakin ingin menghapus user ID #${userId}?`)) {
    return;
  }

  const TARGET_API_URL = `/api/users/${userId}`;

  try {
    const response = await fetch(TARGET_API_URL, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json'
      }
    });

    const result = await response.json();

    if (response.ok && result.success) {
      alert(result.message || 'User berhasil dihapus!');
      fetchUsers(); // Reload/refresh daftar user di tabel
    } else {
      alert(result.message || 'Gagal menghapus user.');
    }
  } catch (error) {
    console.error('Error saat menghapus user:', error);
    alert('Terjadi kesalahan koneksi ke backend server.');
  }
}
document.addEventListener('DOMContentLoaded', function () {
  const btnSignOut = document.getElementById('btnSignOut');

  if (btnSignOut) {
    btnSignOut.addEventListener('click', function (e) {
      e.preventDefault();

      // 1. Konfirmasi opsional ke pengguna (opsional)
      if (confirm('Apakah Anda yakin ingin keluar dari sistem?')) {
        
        // 2. Hapus token / data autentikasi dari localStorage & sessionStorage
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        localStorage.clear();
        sessionStorage.clear();

        // 3. Arahkan kembali pengguna ke halaman login
        window.location.href = 'login.html';
      }
    });
  }
});
