<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Detail Pengumuman - Kecamatan Rumbia</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar (Sederhana untuk Detail) -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0">
        <a href="index.html" class="navbar-brand d-flex align-items-center px-4 px-lg-5">
            <h2 class="m-0 text-dark">Web Kecamatan Rumbia</h2>
        </a>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto p-4 p-lg-0">
                <a href="index.html" class="nav-item nav-link">Kembali ke Beranda</a>
            </div>
        </div>
    </nav>

    <!-- Content Detail Berita -->
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8" id="detail-container">
                    <!-- Loading Text -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3">Memuat pengumuman...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Ambil ID dari URL (contoh: detail-berita.html?id=5)
            const urlParams = new URLSearchParams(window.location.search);
            const beritaId = urlParams.get('id');

            if (!beritaId) {
                document.getElementById('detail-container').innerHTML = '<div class="alert alert-danger">Berita tidak ditemukan (ID kosong).</div>';
                return;
            }

            // 2. Fetch data spesifik berdasarkan ID ke Backend Node.js
            fetch(`http://localhost:3000/api/berita/${beritaId}`)
                .then(response => {
                    if (!response.ok) throw new Error('Data tidak ditemukan');
                    return response.json();
                })
                .then(berita => {
                    const container = document.getElementById('detail-container');
                    const gambarUrl = berita.gambar ? `http://localhost:3000/uploads/${berita.gambar}` : 'img/default.jpg';
                    const tanggal = new Date(berita.created_at).toLocaleDateString('id-ID', {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });

                    // Render HTML
                    container.innerHTML = `
                        <div class="mb-4">
                            <span class="badge bg-primary mb-2">${berita.nama_kategori || 'Kategori'}</span>
                            <h1 class="display-5 mb-3">${berita.judul}</h1>
                            <div class="d-flex text-muted mb-4 border-bottom pb-3">
                                <span class="me-4"><i class="fa fa-user-tie text-primary me-2"></i>${berita.nama_penulis || 'Admin'}</span>
                                <span><i class="fa fa-calendar text-primary me-2"></i>${tanggal}</span>
                            </div>
                        </div>
                        <img class="img-fluid w-100 rounded mb-5" src="${gambarUrl}" alt="${berita.judul}" style="max-height: 500px; object-fit: cover;">
                        <div class="fs-5" style="line-height: 1.8;">
                            ${berita.konten}
                        </div>
                        <div class="mt-5">
                            <a href="index.html" class="btn btn-secondary"><i class="fa fa-arrow-left me-2"></i>Kembali</a>
                        </div>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('detail-container').innerHTML = '<div class="alert alert-danger">Maaf, pengumuman gagal dimuat atau tidak ditemukan.</div>';
                });
        });
    </script>
</body>
</html>
