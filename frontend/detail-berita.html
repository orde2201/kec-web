<!DOCTYPE html>
<html lang="id">
<head>
    <style>
  /* Menjaga seluruh container agar tidak melebihi lebar layar */
  #detail-container {
    max-width: 100%;
    overflow-x: hidden;
  }

  /* Mengunci teks & URL panjang agar otomatis ganti baris */
  .berita-content {
    line-height: 1.8;
    text-align: justify;
    overflow-wrap: anywhere; /* Memutus kata/URL panjang dengan rapi */
    word-break: break-word;
    max-width: 100%;
  }

  /* Mencegah judul utama meluap */
  .berita-title {
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* Mencegah gambar/iframe bawaan konten meluap keluar layar */
  .berita-content img, 
  .berita-content iframe {
    max-width: 100% !important;
    height: auto !important;
  }
</style>
    <meta charset="utf-8">
    <title>Detail Pengumuman & Berita - Kecamatan Rumbia</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
   <nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0">
    <!-- BRAND / LOGO -->
    <a href="index.html" class="navbar-brand d-flex align-items-center px-4 px-lg-5">
        <h2 class="m-0 text-dark fs-4 d-flex align-items-center">
            <img src="img/logo.png" alt="Logo" style="height: 8vw; width: auto; margin-left: -2vw;" class="me-2">
            <span>Web Kecamatan Rumbia</span>
        </h2>
    </a>

    <!-- TOGGLER BUTTON (MOBILE) -->
    <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- MENU CONTAINER -->
    <div class="collapse navbar-collapse px-4 px-lg-0" id="navbarCollapse">
        <div class="navbar-nav ms-auto p-4 p-lg-0 align-items-lg-center">
            <a href="index.html" class="nav-item nav-link active">Beranda</a>
            <a href="courses.html" class="nav-item nav-link">Berita Acara</a>
            
            <!-- INPUT PENCARIAN -->
            <div class="nav-item px-lg-3 py-2 py-lg-0">
                <div class="input-group" style="max-width: 250px;">
                    <input type="text" id="search-input" class="form-control form-control-sm border-primary" placeholder="Cari judul berita..." aria-label="Cari berita">
                    <button class="btn btn-sm btn-primary" type="button" id="search-btn" title="Cari Berita">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- TOMBOL LOGIN -->
        <a href="admin/html/index.html" class="btn btn-primary py-2 px-4 ms-lg-3 me-lg-20 my-3 my-lg-0 d-inline-flex align-items-center justify-content-center">
            Login<i class="fa fa-arrow-right ms-2"></i>
        </a>
    </div>
</nav>

    <div class="container-xxl py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8" id="detail-container">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3">Memuat berita...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Menggunakan CDN JS Bootstrap Bundle agar dipastikan memuat Popper.js & Fungsi Carousel -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const beritaId = urlParams.get('id');

            if (!beritaId) {
                document.getElementById('detail-container').innerHTML = '<div class="alert alert-danger">Berita tidak ditemukan (ID kosong).</div>';
                return;
            }

            fetch(`http://localhost:3000/api/berita/${beritaId}`)
                .then(response => {
                    if (!response.ok) throw new Error('Data tidak ditemukan');
                    return response.json();
                })
                .then(berita => {
                    const container = document.getElementById('detail-container');
                    const tanggal = new Date(berita.created_at).toLocaleDateString('id-ID', {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });

                    // Render Multi-Foto / Single Foto
                    let galeriHTML = '';
                    let hasMultipleImages = false;

                    if (berita.gambar && berita.gambar.trim() !== '') {
                        const gambarArray = berita.gambar.split(',').map(g => g.trim()).filter(g => g !== '');
                        
                        if (gambarArray.length === 1) {
                            galeriHTML = `
                                <img class="img-fluid w-100 rounded mb-5 shadow-sm" 
                                     src="http://localhost:3000/uploads/${gambarArray[0]}" 
                                     alt="${berita.judul}" 
                                     style="max-height: 500px; object-fit: cover;">
                            `;
                        } else if (gambarArray.length > 1) {
                            hasMultipleImages = true;
                            let indicators = '';
                            let carouselInner = '';

                            gambarArray.forEach((img, idx) => {
                                const activeClass = idx === 0 ? 'active' : '';
                                const ariaCurrent = idx === 0 ? 'aria-current="true"' : '';
                                
                                indicators += `<button type="button" data-bs-target="#sliderBerita" data-bs-slide-to="${idx}" class="${activeClass}" ${ariaCurrent} aria-label="Slide ${idx + 1}"></button>`;
                                carouselInner += `
                                    <div class="carousel-item ${activeClass}">
                                        <img src="http://localhost:3000/uploads/${img}" class="d-block w-100 rounded" style="max-height: 500px; object-fit: cover;" alt="Foto ${idx + 1}">
                                    </div>
                                `;
                            });

                            galeriHTML = `
                                <div id="sliderBerita" class="carousel slide mb-5 shadow-sm rounded" data-bs-ride="carousel">
                                    <div class="carousel-indicators">${indicators}</div>
                                    <div class="carousel-inner rounded">${carouselInner}</div>
                                    <button class="carousel-control-prev" type="button" data-bs-target="#sliderBerita" data-bs-slide="prev">
                                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Sebelumnya</span>
                                    </button>
                                    <button class="carousel-control-next" type="button" data-bs-target="#sliderBerita" data-bs-slide="next">
                                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Selanjutnya</span>
                                    </button>
                                </div>
                            `;
                        }
                    } else {
                        galeriHTML = `<img class="img-fluid w-100 rounded mb-5" src="img/default.jpg" style="max-height: 400px; object-fit: cover;">`;
                    }

                    // Tampilkan Konten ke Halaman
                    container.innerHTML = `
                        <div class="mb-4">
                            <span class="badge bg-primary mb-2 fs-6">${berita.nama_kategori || 'Umum'}</span>
                            <h1 class="display-5 mb-3">${berita.judul}</h1>
                            <div class="d-flex text-muted mb-4 border-bottom pb-3">
                                <span class="me-4"><i class="fa fa-user-tie text-primary me-2"></i>${berita.nama_penulis || 'Admin'}</span>
                                <span><i class="fa fa-calendar text-primary me-2"></i>${tanggal}</span>
                            </div>
                        </div>
                        ${galeriHTML}
                        <div class="fs-5" style="line-height: 1.8; text-align: justify;">
                            ${berita.konten}
                        </div>
                        <div class="mt-5">
                            <a href="index.html" class="btn btn-secondary"><i class="fa fa-arrow-left me-2"></i>Kembali</a>
                        </div>
                    `;

                    // ==========================================
                    // INISIALISASI MANUAL CAROUSEL (Kunci Perbaikan)
                    // ==========================================
                    if (hasMultipleImages) {
                        const sliderElement = document.getElementById('sliderBerita');
                        if (sliderElement && typeof bootstrap !== 'undefined') {
                            new bootstrap.Carousel(sliderElement, {
                                interval: 3500, // Opsi: Otomatis bergeser tiap 3.5 detik
                                wrap: true,     // Putar kembali ke gambar awal setelah gambar terakhir
                                touch: true     // Aktifkan geser layar sentuh di HP
                            });
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('detail-container').innerHTML = '<div class="alert alert-danger">Maaf, berita gagal dimuat atau tidak ditemukan.</div>';
                });
        });
    </script>
</body>
</html>
